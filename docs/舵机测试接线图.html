<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>舵机测试接线图</title>
<style>body{margin:0;background:#fff;color:#1d1d1f;font:16px/1.6 -apple-system,"PingFang SC",sans-serif}main{max-width:980px;margin:auto;padding:20px 16px}svg{width:100%;height:auto;display:block}table{border-collapse:collapse;width:100%;margin:12px 0}td,th{border:1px solid #ddd;padding:6px 10px;text-align:left}.w{background:#fff3e0;border-left:4px solid #e65100;padding:8px 12px}</style></head><body><main>
<h1>MG996R 测试接线图</h1>
<svg viewBox="0 0 940 560" font-family="-apple-system,PingFang SC,sans-serif">
<rect x="70" y="120" width="210" height="350" rx="8" fill="#2e7d32"/><rect x="140" y="88" width="70" height="44" rx="5" fill="#b0b0b0" stroke="#555"/><text x="175" y="78" text-anchor="middle" font-size="15" font-weight="700">USB → 电脑</text>

<text x="106" y="151" font-size="14" font-weight="700" fill="#fff">GP0 · 1 脚</text>
<text x="244" y="151" text-anchor="end" font-size="13" fill="#ddd">VBUS 不接</text><text x="244" y="181" text-anchor="end" font-size="13" fill="#ddd">VSYS 不接</text>
