[project]
name = "head"
version = "0.1.0"
description = "Will Cogley robotic head α2.0.33 reproduction for robot affect learning"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy", "pyserial", "matplotlib"]

[project.optional-dependencies]
vision = ["mediapipe", "opencv-python"]
dev = ["pytest", "mpremote"]

[tool.setuptools]
packages = ["head", "camera", "culture", "lingmou"]

[tool.setuptools.package-data]
camera = ["web.html"]
head = ["hub.html"]
culture = ["page.html", "face.js", "samples/*"]
lingmou = ["console.html", "demo.html"]

[tool.pytest.ini_options]
testpaths = ["tests", "camera"]
