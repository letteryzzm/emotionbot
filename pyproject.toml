[project]
name = "head"
version = "0.1.0"
description = "Will Cogley robotic head α2.0.33 reproduction for robot affect learning"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy", "pyserial", "matplotlib"]

[project.optional-dependencies]
vision = ["mediapipe", "opencv-python", "emotiefflib", "timm"]
audio = ["sounddevice", "soundfile"]
# emotion2vec 模型由 FunASR 加载，不是独立的 PyPI 包。
realtime = ["funasr", "transformers==4.57.6", "edge-tts", "miniaudio"]
dev = ["pytest", "mpremote"]

[tool.setuptools]
packages = ["head", "camera", "culture", "lingmou", "perception", "agent", "app"]

[tool.setuptools.package-data]
camera = ["web.html"]
head = ["hub.html", "centers.json"]
culture = ["page.html", "face.js", "samples/*"]
lingmou = ["console.html", "demo.html"]
app = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests", "camera"]
