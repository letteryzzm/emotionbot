[project]
name = "head"
version = "0.1.0"
description = "Will Cogley robotic head α2.0.33 reproduction for robot affect learning"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy", "pyserial", "matplotlib"]

[project.optional-dependencies]
vision = ["mediapipe", "opencv-python", "emotiefflib", "timm"]
audio = ["sounddevice", "soundfile"]
realtime = ["funasr", "emotion2vec", "edge-tts", "miniaudio"]
dev = ["pytest", "mpremote"]

[tool.setuptools]
packages = ["head", "perception", "agent", "app"]

[tool.setuptools.package-data]
app = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
