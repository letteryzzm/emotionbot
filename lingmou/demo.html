<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>灵眸</title>
<style>
/* 展示用：始终是深色舞台，字号跟屏幕走，铺满不滚动 */
:root{--bg:#120c0a;--panel:#1d1512;--panel2:#261b17;--line:#3b2c25;--ink:#f4eadb;--dim:#b9a795;--gold:#f0c977;--red:#c4402f;--ok:#5fc48e;
--white:#fbf7ee;--iris:#1b1b1f;--pupil:#000;--lip:#8f2b2a;--mouth:#2b0c0d;--tongue:#c8666c;color-scheme:dark}
html{font-size:clamp(15px,calc(.55vw + .6vh),27px);height:100%;background:var(--bg)}
*{box-sizing:border-box}body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:1rem/1.55 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;
display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:.6rem;padding:.55rem 1rem;cursor:pointer;touch-action:manipulation}
button:hover{border-color:var(--gold)}button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.main{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:.6rem;padding:.6rem .9rem;min-width:0}
.dim{color:var(--dim)}[hidden]{display:none!important}
/* 顶栏 */
header{display:flex;align-items:center;gap:1.2rem;padding:.9rem 1.6rem .4rem}
h1{font:700 2.1rem/1 "Songti SC","Noto Serif CJK SC",serif;letter-spacing:.18em;margin:0;color:var(--gold)}
header p{margin:0;color:var(--dim);font-size:1.05rem}
.tools{margin-left:auto;display:flex;gap:.6rem;align-items:center}
#power{display:flex;align-items:center;gap:.5rem;font-size:.9rem}#power i{width:.65rem;height:.65rem;border-radius:50%;background:var(--red)}#power.on i{background:var(--ok)}
#fs{font-size:.9rem}
/* 主区 */
main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:1.4rem;padding:.6rem 1.6rem;min-height:0}
.stage{position:relative;display:flex;flex-direction:column;min-height:0;border-radius:1.2rem;padding:1rem 1.2rem .9rem;
background:radial-gradient(ellipse at 50% 0,#4a2219,#2a1512 55%,#1a0d0b 100%);box-shadow:inset 0 0 0 1px #ffffff10}
#faceBox{flex:1;min-height:0;display:flex;justify-content:center}#face{height:100%;width:100%;max-width:100%}
#cap{min-height:2.6em;display:flex;align-items:center;justify-content:center;text-align:center;font:700 clamp(1.4rem,2.2vw,3rem)/1.3 "Songti SC","Noto Serif CJK SC",serif;letter-spacing:.08em;color:var(--gold);padding:0 .5rem}
#bar{height:4px;background:#ffffff1a;border-radius:2px;overflow:hidden}#bar u{display:block;height:100%;width:0;background:var(--gold);transition:width .1s linear}
#chip{position:absolute;top:1rem;left:1.2rem;padding:.2rem .9rem;border-radius:2rem;background:var(--red);color:#fff;font-weight:700;font-size:1rem}#chip:empty{display:none}
.panel{display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:1.2rem;padding:1.2rem 1.3rem}
.panel h2{font:700 1.5rem/1.3 "Songti SC","Noto Serif CJK SC",serif;margin:0 0 .3rem;letter-spacing:.05em}.panel .lead{margin:0 0 1rem;color:var(--dim)}
.fill{flex:1;min-height:0;overflow:auto}
/* 欢迎 */
.welcome{display:grid;gap:.7rem}.welcome button{display:grid;grid-template-columns:3rem 1fr;gap:.2rem 1rem;align-items:center;text-align:left;padding:.9rem 1rem}
.welcome svg{grid-row:span 2;width:2.6rem;height:2.6rem;color:var(--gold)}.welcome button>span{display:block}.welcome b{font-size:1.2rem;display:block}.welcome span{color:var(--dim);font-size:.92rem}
/* 看戏 */
.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.7rem}.gallery button{padding:0;overflow:hidden;position:relative;border-radius:.8rem}
.gallery img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;display:block}
.gallery b{position:absolute;left:0;right:0;bottom:0;padding:1.4rem .6rem .45rem;background:linear-gradient(transparent,#000c);font-size:1rem;text-align:left}
.gallery button.on{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold)}
#onote{margin:.8rem 0 0;color:var(--dim);min-height:3em}.row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;margin-top:.9rem}
/* 摄像头 */
.cam{position:relative;border-radius:.9rem;overflow:hidden;background:#000;aspect-ratio:4/3;max-height:52vh;margin:0 auto;width:100%}
.cam img{width:100%;height:100%;object-fit:cover;display:block}.cam .tag{position:absolute;left:.8rem;bottom:.8rem;padding:.25rem .8rem;border-radius:2rem;background:#000a;font-weight:700}
.cam .wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.scale{position:relative;display:grid;grid-template-columns:18fr 20fr 40fr 22fr;height:2.4rem;border-radius:.6rem;overflow:hidden;margin-top:1rem;font-size:.9rem;text-align:center;line-height:2.4rem;color:#fff}
.scale span:nth-child(1){background:#a8281e}.scale span:nth-child(2){background:#c47a1e}.scale span:nth-child(3){background:#2f7d5b}.scale span:nth-child(4){background:#5c5853}
#mark{position:absolute;top:-4px;bottom:-4px;width:6px;margin-left:-3px;border-radius:3px;background:#fff;box-shadow:0 0 0 2px #000a;display:none;transition:left .2s}
.tries{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}.tries span{padding:.3rem .9rem;border-radius:2rem;border:1px solid var(--line);color:var(--dim)}.tries span.on{background:var(--gold);border-color:var(--gold);color:#241a10;font-weight:700}
/* 对话 */
.mic{display:flex;align-items:center;gap:1rem;margin-bottom:.8rem}
.ring{position:relative;width:3.6rem;height:3.6rem;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--panel2);border:2px solid var(--line)}
.ring svg{width:1.7rem;height:1.7rem;color:var(--dim)}.ring i{position:absolute;inset:-2px;border-radius:50%;border:3px solid var(--ok);opacity:0;transform:scale(1);transition:transform .1s,opacity .2s}
.mic.live .ring svg{color:var(--ok)}.mic.live .ring i{opacity:.8}#vs{font-size:1.15rem;font-weight:600}#vsub{font-size:.88rem}
#chat{display:flex;flex-direction:column;gap:.6rem;overflow:auto;padding-right:.3rem}
#chat div{padding:.6rem 1rem;border-radius:1rem;max-width:88%;font-size:1.1rem}#chat .me{align-self:flex-end;background:var(--panel2);border-bottom-right-radius:.3rem}#chat .it{background:#f0c97722;border-bottom-left-radius:.3rem}
#chat:empty:before{content:"说一句“你好”试试";color:var(--dim)}
#says{display:flex;gap:.6rem;margin-top:.8rem}#says input{flex:1}
.mini{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:1rem;min-height:0;flex:1}.mini .cam{max-height:none}
/* 底部玩法 */
nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.8rem;padding:.8rem 1.6rem 1.1rem}
nav button{display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;text-align:left;border-radius:1rem}
nav svg{width:2.2rem;height:2.2rem;flex:none;color:var(--gold)}nav b{display:block;font:700 1.35rem/1.2 "Songti SC","Noto Serif CJK SC",serif}nav span{font-size:.85rem;color:var(--dim);display:block;line-height:1.3}
nav button.on{background:var(--gold);border-color:var(--gold);color:#241a10}nav button.on svg{color:#241a10}nav button.on span{color:#241a10cc}
@media(max-aspect-ratio:1/1),(max-width:820px){body{overflow:auto;height:auto}main{grid-template-columns:minmax(0,1fr)}.stage{height:62vh}
nav{grid-template-columns:repeat(3,minmax(0,1fr))}nav span{display:none}.gallery{grid-template-columns:repeat(4,minmax(0,1fr))}.mini{grid-template-columns:minmax(0,1fr)}}
@media(max-width:520px){header p{display:none}nav{grid-template-columns:repeat(2,minmax(0,1fr))}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><h1>灵眸</h1><p>看见你，听见你，也能演给你看</p>
<div class="tools"><button id="power"><i></i><span>连接真机</span></button><button id="fs" title="全屏（F）">全屏</button></div></header>
<main>
<section class="stage" aria-label="灵眸的脸"><span id="chip"></span><div id="faceBox"></div><div id="cap" aria-live="polite"></div><div id="bar"><u id="barv"></u></div></section>
<section class="panel">
 <div id="pHome" class="fill"><h2>你好，我是灵眸</h2><p class="lead">一个会看、会听、会演的机器人头。选一个玩法开始：</p><div class="welcome" id="welcome"></div></div>
 <div id="pOpera" class="fill" hidden><h2>选一张脸谱，看它演</h2><p class="lead">京剧的亮相、怒目、冷笑，还有动漫表情。</p>
  <div class="gallery" id="gallery"></div><p id="onote"></p>
  <div class="row"><button class="main" id="tour">从头巡演 7 段</button><button id="ostop">停止</button></div></div>
 <div id="pCam" class="fill" hidden><h2 id="camTitle"></h2><p class="lead" id="camLead"></p>
  <div class="cam"><img id="cam" alt="摄像头画面"><div class="wait" id="camWait">摄像头正在打开…</div><span class="tag" id="camTag" hidden></span></div>
  <div class="scale" id="scale"><span>贴脸</span><span>太近</span><span>刚好</span><span>太远</span><i id="mark"></i></div>
  <div class="tries" id="tries"></div></div>
 <div id="pTalk" hidden style="display:flex;flex-direction:column;min-height:0;flex:1"><h2>和它说话</h2>
  <div class="mic" id="mic"><div class="ring"><i id="ringv"></i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div>
   <div><div id="vs"></div><div class="dim" id="vsub">说完停一下，它就会回答</div></div></div>
  <div class="mini" id="mini"><div class="cam" id="miniCam" hidden><img id="cam2" alt="摄像头画面"></div><div id="chat"></div></div>
  <form id="says"><input id="say" placeholder="也可以打字和它说" autocomplete="off" aria-label="打字和它说话"><button class="main">说</button></form></div>
</section>
</main>
<nav id="nav" aria-label="玩法"></nav>
<script src="/face.js"></script>
<script>
let M,S,camOn=null,shown="";
const IC={
 opera:'<path d="M12 3c4.5 0 8 2 8 6.5 0 5-3.6 11.5-8 11.5S4 14.5 4 9.5C4 5 7.5 3 12 3z"/><path d="M7 9.5q2-1.6 4 0M13 9.5q2-1.6 4 0M9 15q3 2 6 0"/>',
 track:'<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 mimic:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M12 4v16M7 10h.01M17 10h.01M6.5 15q1.5 1.5 3 0M14.5 15q1.5 1.5 3 0"/>',
 talk:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8M8 13h5"/>',
 interact:'<path d="M12 3l1.8 4.6L18.5 9l-4.7 1.4L12 15l-1.8-4.6L5.5 9l4.7-1.4z"/><path d="M18 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/>'};
const TABS=[["opera","看戏","京剧脸谱的表演"],["track","看见你","眼睛跟着你，远近变表情"],["mimic","学你","照镜子一样学你的表情"],["talk","听你说","开口聊天，脸跟着回答"],["interact","一起玩","边看边听"]];
const EM={neutral:"平静",happy:"开心",sad:"难过",angry:"生气",surprise:"惊讶",fear:"害怕",disgust:"厌恶"};
const ZN={bored:"有点无聊……",interested:"我看到你了",annoyed:"太近了！",fear:"别贴过来！"};
const TRY=["眨一只眼","闭眼","开心","惊讶","生气","张嘴"],TRYTXT={"眨一只眼":"眨一只眼","闭眼":"闭上眼","开心":"笑一个","惊讶":"张大嘴挑眉","生气":"皱眉","张嘴":"张嘴"};
const icon=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">${IC[k]}</svg>`;
const api=b=>fetch("/api",{method:"POST",headers:{"Content-Type":"application/json","X-Head":"1"},body:JSON.stringify(b)}).then(r=>r.json()).catch(()=>({error:"连不上总控"}));
let flash="",flashUntil=0;const say=t=>{flash=t;flashUntil=Date.now()+3500};
function cam(img,on){img.dataset.on=on?"1":"";if(on&&!img.src.includes("/cam"))img.src="/cam?"+Date.now();if(!on&&img.src)img.removeAttribute("src")}
function frame(){if(!S)return;const h=S.hub,o=S.opera,v=S.voice,c=S.camera,m=S.mode;
 if(h)draw(h.u);
 document.querySelectorAll("#nav button").forEach(b=>{const on=b.dataset.m===m;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on)});
 const mim=m==="mimic",seeing=m==="track"||mim,talking=m==="talk"||m==="interact",home=!["opera","track","mimic","talk","interact"].includes(m);
 $("pHome").hidden=!home;$("pOpera").hidden=m!=="opera";$("pCam").hidden=!seeing;$("pTalk").hidden=!talking;
 const a=o&&o.playing?M.actions.find(x=>x.id===o.playing):null;if(a)skin(a.skin);else if(m!=="opera")skin("robot");
 const live=S.services.camera&&c.ok;
 cam($("cam"),seeing&&live);cam($("cam2"),m==="interact"&&live);$("miniCam").hidden=m!=="interact";$("camWait").hidden=seeing&&live;
 if(seeing){$("camTitle").textContent=mim?"做个表情，它学你":"它在看着你";$("camLead").textContent=mim?"像照镜子：你闭左眼，它闭你看到的左边那只。":"走近、走远、左右走动，看它的眼睛和表情。";
  $("scale").hidden=mim;$("tries").hidden=!mim;const t=$("camTag");t.hidden=!c.face;t.textContent=mim?("你现在："+(c.expr||"")):(c.face?`${c.dist.toFixed(2)} m`:"");
  document.querySelectorAll("#tries span").forEach(s=>s.classList.toggle("on",c.face&&s.dataset.k===c.expr));
  const mk=$("mark");mk.style.display=c.face&&!mim?"block":"none";if(c.face&&!mim){const d=c.dist,z=[[.15,.28,0,18],[.28,.45,18,38],[.45,1.5,38,78],[1.5,3,78,100]].find(q=>d<q[1])||[1.5,3,78,100];mk.style.left=Math.min(100,z[2]+(d-z[0])/(z[1]-z[0])*(z[3]-z[2]))+"%"}}
 const last=v.turns.at(-1),speaking=talking&&(v.status==="说话中"||v.status==="合成中"),thinking=talking&&(v.status==="思考中"||v.status==="识别中");
 let cap;if(Date.now()<flashUntil)cap=flash;else if(a)cap=o.beat||a.name;else if(speaking&&last)cap=last.reply||"";else if(thinking)cap="让我想想……";
 else if(mim)cap=!live?"摄像头正在打开":c.face?"我学你："+c.expr:"站到镜头前，做个表情";else if(seeing)cap=!live?"摄像头正在打开":ZN[c.zone]||"";
 else if(talking)cap=v.error?"":v.paused?"":"我在听";else if(m==="opera")cap="请选一张脸谱";else cap="你好，选一个玩法吧";
 $("cap").textContent=cap;$("barv").style.width=(a?o.progress*100:0)+"%";
 $("chip").textContent=speaking&&last&&EM[last.emotion]?EM[last.emotion]:(a?a.name:"");
 if(talking){const listening=v.ready&&!v.paused&&!v.error;$("mic").classList.toggle("live",listening);
  $("vs").textContent=v.error||(!v.ready?"语音正在准备":speaking?"它在说话":thinking?"它在想":v.status==="listening…"?"听到你在说话…":"我在听，直接说话");
  const lv=v.ready?Math.min(1,v.rms/Math.max((v.threshold||1)*2,1500)):0;$("ringv").style.transform=`scale(${1+lv*.6})`;
  const key=v.turns.length+(last?.reply||"");if(key!==shown){shown=key;const C=$("chat");C.textContent="";v.turns.forEach(t=>{for(const[k,x]of[["me",t.text],["it",t.reply]])if(x){const d=document.createElement("div");d.className=k;d.textContent=x;C.append(d)}});C.scrollTop=C.scrollHeight}}
 const armed=h&&h.armed.length>0,p=$("power");p.classList.toggle("on",!!armed);p.querySelector("span").textContent=armed?"真机已连接":"连接真机";p.disabled=!!armed}
function go(mode){api({op:"mode",mode}).then(r=>r.error&&say(r.error))}
$("tour").onclick=()=>api({op:"tour",group:"opera",intensity:1});$("ostop").onclick=()=>api({op:"stop"});
$("power").onclick=async()=>{const r=await api({op:"arm"});if(r.error)say(r.error)};
$("says").onsubmit=e=>{e.preventDefault();const t=$("say").value.trim();if(t){api({op:"say",text:t}).then(r=>r.error&&say(r.error));$("say").value=""}};
const full=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});
$("fs").onclick=full;addEventListener("keydown",e=>{if(e.target.tagName!=="INPUT"&&(e.key==="f"||e.key==="F"))full()});
document.addEventListener("fullscreenchange",()=>$("fs").textContent=document.fullscreenElement?"退出全屏":"全屏");
(async()=>{M=await(await fetch("/meta")).json();$("faceBox").innerHTML=FACE_SVG;skin("robot");draw(M.rest);
 TABS.forEach(([m,t,n])=>{const b=document.createElement("button");b.dataset.m=m;b.innerHTML=`${icon(m)}<span><b>${t}</b><span>${n}</span></span>`;b.onclick=()=>go(m);$("nav").append(b);
  const w=b.cloneNode(true);w.onclick=()=>go(m);$("welcome").append(w)});
 TRY.forEach(k=>{const s=document.createElement("span");s.dataset.k=k;s.textContent=TRYTXT[k];$("tries").append(s)});
 M.samples.forEach(s=>{const b=document.createElement("button"),r=s.result;b.setAttribute("aria-label",s.label);b.innerHTML=`<img src="/samples/${s.file}" alt=""><b>${s.label}</b>`;
  b.onclick=()=>{document.querySelectorAll("#gallery button").forEach(x=>x.classList.toggle("on",x===b));const a=M.actions.find(x=>x.id===r.action);skin(a.skin);$("onote").textContent=`${r.subject}：${a.name}。${a.note}`;api({op:"play",action:r.action,intensity:r.intensity||1}).then(x=>x.error&&say(x.error))};$("gallery").append(b)});
 const es=new EventSource("/events");es.onmessage=e=>{S=JSON.parse(e.data)};es.onerror=()=>say("和总控的连接断了，正在重连");setInterval(frame,70)})();
</script></body></html>
