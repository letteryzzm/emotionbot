<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>灵眸戏台</title>
<style>
:root{--bg:#f4efe6;--paper:#fffaf1;--ink:#231c17;--dim:#74685c;--line:#e0d5c3;--red:#a8281e;--gold:#a97a1e;--stage:#2a1512;--stage2:#431e18;
--white:#fbf7ee;--iris:#1b1b1f;--pupil:#000;--lip:#8f2b2a;--mouth:#2b0c0d;--tongue:#c8666c}
@media(prefers-color-scheme:dark){:root{--bg:#17120f;--paper:#221b16;--ink:#efe6d8;--dim:#ab9d8b;--line:#3d3127;--red:#e0604f;--gold:#dcab4b}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:18px 20px 10px;max-width:1240px;margin:0 auto}
h1{font:700 28px/1.2 "Songti SC","Noto Serif CJK SC",serif;margin:0;letter-spacing:.08em}header p{margin:0;color:var(--dim)}
h2{font-size:13px;color:var(--dim);font-weight:600;margin:0 0 8px}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,.95fr);gap:16px;padding:6px 20px 28px;max-width:1240px;margin:0 auto}
@media(max-width:1020px){main{grid-template-columns:minmax(0,1fr)}.stagecol{order:-1}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
button{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--red)}button:disabled{opacity:.5;cursor:default}
button.main{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
#drop{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:210px;border:2px dashed var(--line);border-radius:9px;padding:10px;text-align:center;color:var(--dim);cursor:pointer;overflow:hidden}
#drop.over{border-color:var(--red)}#drop img{max-width:100%;max-height:300px;border-radius:6px;display:block}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.gallery button{padding:0;overflow:hidden;border-radius:7px;text-align:left}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;object-position:top;display:block}.gallery b,.gallery span{display:block;padding:0 6px;font-size:12px;line-height:1.4}.gallery b{padding-top:4px}.gallery span{padding-bottom:5px;color:var(--dim)}
.gallery button.on{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}details summary{cursor:pointer;color:var(--dim);font-size:13px;margin-bottom:0}details[open] summary{margin-bottom:10px}
#emotion{display:inline-block;padding:1px 10px;border-radius:12px;background:var(--red);color:#fff;font-weight:600;font-size:13px;margin-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.dim{color:var(--dim);font-size:12.5px}.credit{font-size:11px;color:var(--dim);margin:8px 0 0}
#err{color:var(--red);font-weight:600;min-height:0}#err:not(:empty){margin-top:8px}
#result h3{margin:0;font:700 19px/1.3 "Songti SC","Noto Serif CJK SC",serif}#result p{margin:6px 0 0}
.stage{position:relative;background:radial-gradient(ellipse at 50% 0,var(--stage2),var(--stage) 70%);border-radius:10px;padding:14px 14px 10px;margin-bottom:14px;color:#f4e7d3}
#face{display:block;width:100%;max-height:60vh}
#beat{min-height:44px;text-align:center;font:700 26px/44px "Songti SC","Noto Serif CJK SC",serif;letter-spacing:.14em;color:#f0c977}
#bar{height:3px;background:#ffffff22;border-radius:2px;overflow:hidden}#bar u{display:block;height:100%;width:0;background:#f0c977}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.controls label{display:flex;gap:6px;align-items:center;font-size:13px}
.stage button{background:#ffffff14;border-color:#ffffff33;color:inherit}.stage button.main{background:#b5342a;border-color:#b5342a;color:#fff}
#hub{font-size:12px;opacity:.8}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button.on{background:var(--red);color:#fff;border-color:var(--red)}
.acts{display:grid;gap:6px}.acts button{text-align:left;padding:8px 10px;line-height:1.4}.acts button b{display:block}.acts button span{font-size:12px;color:var(--dim)}
.acts button.on{border-color:var(--red);box-shadow:inset 3px 0 0 var(--red)}
</style></head><body>
<header><h1>灵眸戏台</h1><p>给一张京剧或动漫图片，看灵眸演出来。</p></header>
<main>
<section>
<div class="card"><h2>预设图片</h2><div class="gallery" id="gallery"></div></div>
<div class="card" id="result" hidden></div>
<details class="card"><summary>上传自己的图片（识别联调中）</summary>
<div id="drop" tabindex="0" role="button" aria-label="选择图片"><span id="hint">点击或拖入京剧、动漫图片<br>JPG / PNG，12 MB 以内</span></div>
<input id="file" type="file" accept="image/*" hidden>
<div class="row" style="margin-top:10px"><button class="main" id="go" disabled>识别并表演</button></div>
<p class="dim" id="privacy">点“识别并表演”后，图片会发送给阿里云百炼的千问全模态模型。</p>
<div id="err" role="alert"></div></details>
<p class="credit" id="credit"></p>
</section>
<section class="stagecol">
<div class="stage">
<div id="faceBox"></div>
<div id="beat" aria-live="polite"></div><div id="bar"><u id="barv"></u></div>
<div class="controls"><button class="main" id="replay" disabled>再演一次</button>
<label>强度 <input id="k" type="range" min="0.2" max="1" step="0.05" value="0.8" aria-label="动作强度"></label>
<label><input type="checkbox" id="robot"> 同步到真机</label><span id="hub"></span></div>
</div>
<div class="card" id="note" hidden></div>
</section>
<section>
<div class="card"><h2>动作</h2><div class="tabs"><button data-g="opera" class="on">京剧</button><button data-g="anime">动漫</button></div>
<div class="acts" id="acts"></div>
<p class="dim">这个头只有眼、眉、嘴，水袖和身段做不了。颜色只显示在画面里，真机的脸不会变色。</p></div>
</section>
</main>
<script src="/face.js"></script>
<script>
let M,S,cur=null,blob=null,group="opera";
const EM={neutral:"平静",happy:"开心",sad:"难过",angry:"生气",surprise:"惊讶",fear:"害怕",disgust:"厌恶"};
const api=b=>fetch("/api",{method:"POST",headers:{"Content-Type":"application/json","X-Head":"1"},body:JSON.stringify(b)});
const A=id=>M.actions.find(a=>a.id===id);
function pick(id,k){cur=id;const a=A(id);skin(a.skin);if(k)$("k").value=k;api({op:"play",action:id,intensity:+$("k").value});$("replay").disabled=false;
 if(group!==a.group)tab(a.group);else marks();
 $("note").hidden=false;$("note").innerHTML=`<h2>${a.name}</h2><div>${a.note}</div>`}
function marks(){document.querySelectorAll("#acts button").forEach(b=>b.classList.toggle("on",b.dataset.a===cur))}
function tab(g){group=g;document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.g===g));
 $("acts").innerHTML="";M.actions.filter(a=>a.group===g).forEach(a=>{const b=document.createElement("button");b.dataset.a=a.id;b.innerHTML=`<b>${a.name}</b><span>${a.use}</span>`;b.onclick=()=>pick(a.id);$("acts").append(b)});marks()}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>tab(b.dataset.g));
function show(r,sourceNote){const box=$("result");box.hidden=false;box.textContent="";
 const h=document.createElement("h3"),p=document.createElement("p"),s=document.createElement("p");
 const kind={opera:"京剧",anime:"动漫",other:"不是京剧或动漫"}[r.category];h.textContent=r.subject||kind;p.textContent=r.evidence||"";
 s.className="dim";if(EM[r.emotion]){const e=document.createElement("div");e.id="emotion";e.textContent="情绪："+EM[r.emotion];box.append(e)}
 s.textContent=r.action?`${kind} · ${A(r.action).name}。模型可能判断错，右边可以换动作。${sourceNote||""}`:"这张图没有匹配的动作，可以换一张，或从右边手动选。";
 box.append(h,p,s);if(r.action)pick(r.action,r.intensity)}
function setImage(src){$("drop").innerHTML="";const i=new Image();i.src=src;i.alt="已选择的图片";$("drop").append(i)}
function useFile(f){if(!f)return;$("err").textContent="";if(f.size>12*1024*1024){$("err").textContent="图片超过 12 MB";return}blob=f;setImage(URL.createObjectURL(f));$("go").disabled=false;$("result").hidden=true}
const drop=$("drop"),file=$("file");drop.onclick=()=>file.click();drop.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();file.click()}};file.onchange=()=>useFile(file.files[0]);
["dragenter","dragover"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove("over")}));drop.addEventListener("drop",e=>useFile(e.dataTransfer.files[0]));
$("go").onclick=async()=>{const b=$("go");b.disabled=true;b.textContent="识别中…";$("err").textContent="";
 try{const r=await fetch("/analyze",{method:"POST",headers:{"X-Head":"1"},body:blob});const d=await r.json().catch(()=>({error:"识图失败，可以从右边选动作"}));
  if(d.error)$("err").textContent=d.error;else show(d)}catch(e){$("err").textContent="连不上本地服务"}b.disabled=false;b.textContent="识别并表演"};
$("replay").onclick=()=>cur&&pick(cur);
$("robot").onchange=e=>api({op:"robot",on:e.target.checked});
function frame(){if(!S)return;draw(S.u);$("beat").textContent=S.beat;$("barv").style.width=S.progress*100+"%";
 $("robot").checked=S.robot;
 $("hub").textContent=!S.robot?"":S.hub_ok===false?"控制进程没连上，只在画面里演":S.hub_ok?"已发送到控制进程":""}
(async()=>{M=await(await fetch("/meta")).json();$("faceBox").innerHTML=FACE_SVG;skin("red");tab("opera");
 M.samples.forEach(s=>{const b=document.createElement("button"),r=s.result;b.setAttribute("aria-label",s.label);
  b.innerHTML=`<img src="/samples/${s.file}" alt=""><b>${s.label}</b><span>${EM[r.emotion]||""} · ${A(r.action).name}</span>`;
  b.onclick=()=>{document.querySelectorAll("#gallery button").forEach(x=>x.classList.toggle("on",x===b));show(r,"这是预设结果。")};$("gallery").append(b)});
 if(M.samples.length){const c=$("credit");c.textContent="图片来自 Wikimedia Commons：";M.samples.forEach((s,i)=>{const a=document.createElement("a");a.href=s.source;a.target="_blank";a.rel="noopener";a.textContent=`${s.label} · ${s.author} · ${s.license}`;if(i)c.append("；");c.append(a)})}
 new EventSource("/events").onmessage=e=>{S=JSON.parse(e.data);requestAnimationFrame(frame)}})();
</script></body></html>
